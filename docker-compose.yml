# Levanta M7 completo en local: la API, su base de datos y Keycloak (M1).
# Uso: cp .env.example .env, completar las claves y docker compose up --build -d

services:
  m7-api:
    build: ./m7-tarifas
    image: m7-tarifas:0.2.0
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-m7}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}@m7-db:5432/${POSTGRES_DB:-m7}
      # Los tokens se piden desde la computadora (localhost), pero la API baja
      # las claves de Keycloak por la red interna de Docker (keycloak:8080).
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/ds-2026-realm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/ds-2026-realm/protocol/openid-connect/certs
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      PASARELA_WEBHOOK_SECRET: ${PASARELA_WEBHOOK_SECRET:?Falta PASARELA_WEBHOOK_SECRET en el .env}
      COMISION_PLATAFORMA: ${COMISION_PLATAFORMA:-0.20}
    depends_on:
      m7-db:
        condition: service_healthy
    restart: unless-stopped

  m7-db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m7}
      POSTGRES_USER: ${POSTGRES_USER:-m7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
    ports:
      - "5432:5432"
    volumes:
      - m7-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en el .env}
    ports:
      - "8080:8080"
    volumes:
      # Acá va ds-2026-realm.json, el realm con los permisos de M7.
      - ./keycloak:/opt/keycloak/data/import

volumes:
  m7-db-datos:
